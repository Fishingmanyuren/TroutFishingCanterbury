<script src="main.js"></script>
<script> //Sending request for articles to the backend
  window.addEventListener("DOMContentLoaded", async() =>{
    const response = await fetch('http://localhost:3000/api/articles/6');
    const data = await response.json()
    console.log(data);
    document.getElementById("article").textContent = data.content; //Load paragraph with article returned by the backend
    document.getElementById("title").textContent = data.title; //Load title with article returned by the backend
    console.log(document.getElementById("paragraph"));
});

  window.addEventListener("DOMContentLoaded", async() =>{
    const container = document.getElementById('comments');
    container.innerHTML = '';
    
    const response = await fetch('http://localhost:3000/api/comments');
    const comments = await response.json()

    comments.forEach(comment => {
      const div = document.createElement('div');
      div.className = 'comment-item';

      const content = document.createElement('p');
      content.textContent = comment.content;

      const time = document.createElement('span');
      time.textContent = new Date(comment.created_at).toLocaleString();

      div.appendChild(content);
      div.appendChild(time);
      container.appendChild(div);
    });
    
});

  document.getElementById("submitComment").addEventListener('click', async (e) =>{
    const comment = document.getElementById("newComment").value.trim();
    const requestBody = {
      content: comment,
      published: true
    };
    try{
      const response = await fetch('http://localhost:3000/api/comments', {
        method: 'POST',
        headers:{
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(requestBody)
      });

      const data = await response.json();

      if (response.ok){
        alert('Comment submitted successfully! ');
        comment.value = "";
      }else{
        alert('Comment failed.')
      }
    }catch (error){
      console.error('Request failed: ', error)
    }
  });
</script>
